<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法人級量化防護網 - 精選波段池</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: right; }
        th { background-color: #2c3e50; color: white; text-align: center; }
        td:nth-child(1), td:nth-child(2) { text-align: left; }
        .up { color: #d9534f; font-weight: bold; }
        .down { color: #5cb85c; font-weight: bold; }
        .chip-buy { color: #d9534f; }
        .chip-sell { color: #5cb85c; }
    </style>
</head>
<body>
    <h1>🛡️ 雙重防護網：有量有價 + 法人真金白銀認養</h1>
    <p>更新時間：<span id="update-time">載入中...</span></p>
    <table id="stock-table">
        <thead>
            <tr>
                <th>代號</th>
                <th>名稱</th>
                <th>成交量(張)</th>
                <th>收盤價</th>
                <th>漲跌</th>
                <th>外資買賣(張)</th>
                <th>投信買賣(張)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('update-time').innerText = data.update_time;
                const tbody = document.querySelector('#stock-table tbody');
                data.stocks.forEach(stock => {
                    const priceClass = stock['漲跌'] > 0 ? 'up' : (stock['漲跌'] < 0 ? 'down' : '');
                    const fiClass = stock['外資買賣超(張)'] > 0 ? 'chip-buy' : (stock['外資買賣超(張)'] < 0 ? 'chip-sell' : '');
                    const itClass = stock['投信買賣超(張)'] > 0 ? 'chip-buy' : (stock['投信買賣超(張)'] < 0 ? 'chip-sell' : '');
                    
                    const row = `<tr>
                        <td>${stock['代號']}</td>
                        <td>${stock['名稱']}</td>
                        <td>${stock['成交量(張)'].toLocaleString()}</td>
                        <td>${stock['收盤價']}</td>
                        <td class="${priceClass}">${stock['漲跌']}</td>
                        <td class="${fiClass}">${stock['外資買賣超(張)'].toLocaleString()}</td>
                        <td class="${itClass}">${stock['投信買賣超(張)'].toLocaleString()}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            });
    </script>
</body>
</html>
